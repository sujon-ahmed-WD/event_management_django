<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Reset Password</title>
</head>
<body class="bg-green-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-3xl font-bold text-center text-green-700 mb-6">Reset Password</h1>
        
        <form method="POST" class="space-y-4">
        {% csrf_token %}
      <label for="email" class="block text-gray-700 font-medium">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
        placeholder="Enter your email"
      />

      <button
        type="submit"
        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition duration-200"
      >
        Send Reset Link
      </button>
    </form>
    <p class="text-center text-sm text-gray-600 mt-4">
      <a href="{% url 'sign_in' %}" class="text-blue-600 hover:underline">Back to Login</a>
    </p>
  </div>
</body>
</html>
