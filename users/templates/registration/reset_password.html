<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Reset Password</title>
</head>
<body class="bg-green-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-3xl font-bold text-center text-green-700 mb-6">Reset Password</h1>
        
        <form method="POST" class="space-y-4">
        {% csrf_token %}
      <!-- csrf token should be included by your backend framework -->
          {{form}}
          <button>RESET</button>
    </form>
    <p class="text-center text-sm text-gray-600 mt-4">
      <a href="{% url 'sign_in' %}" class="text-blue-600 hover:underline">Back to Login</a>
    </p>
  </div>
</body>
</html>
