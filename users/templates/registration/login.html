<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login</title>
  </head>
  <body class="bg-green-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
      <h1 class="text-2xl font-semibold text-center mb-6">Welcome to Login Form</h1>

      {% if messages %}
        {% for message in messages %}
          <p class="bg-green-100 text-green-800 px-4 py-2 rounded border border-green-300 mb-4">
            {{ message }}
          </p>
        {% endfor %}
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <div class="space-y-4">
          {{ form.as_p }}
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 mt-4 rounded transition duration-200"
        >
          Sign In
        </button>
         <a href="{% url "sign_up" %}"><button>Register</button></a>
      </form>
    </div>
  </body>
</html>
