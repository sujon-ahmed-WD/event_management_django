<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login</title>
  </head>
  <body class="bg-green-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
      <h1 class="text-3xl font-bold text-center text-green-700 mb-6">Login to EventHub</h1>

      {% if messages %}
        {% for message in messages %}
          <div class="bg-green-100 text-green-800 px-4 py-2 rounded border border-green-300 mb-4 text-sm">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}

        <button
          type="submit"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded-lg transition duration-200 shadow"
        >
          Sign In
        </button>
      </form>

      <p class="text-sm text-center text-gray-600 mt-4">
        Don't have an account?
        <a href="{% url 'sign_up' %}" class="text-blue-600 hover:underline font-medium">Register here</a>
      </p>
    </div>
  </body>
</html>
