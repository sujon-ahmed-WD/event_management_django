<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login</title>
  </head>
  <body class="bg-gradient-to-br from-green-200 via-green-100 to-green-300 min-h-screen flex items-center justify-center px-4">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Welcome Back</h1>

      {% if messages %}
        {% for message in messages %}
          <div class="bg-green-100 text-green-800 px-4 py-2 rounded-lg border border-green-300 mb-4 text-sm">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST" class="space-y-5">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="flex flex-col sm:flex-row sm:justify-between gap-4 pt-2">
          <!-- Login Button -->
          <button
            type="submit"
            class="w-full sm:w-1/2 bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded-lg transition duration-200"
          >
            Sign In
          </button>

          <!-- Register Button -->
          <a
            href="{% url 'sign_up' %}"
            class="w-full sm:w-1/2 text-center bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium py-2 rounded-lg transition duration-200"
          >
            Register
          </a>
        </div>
      </form>
    </div>
  </body>
</html>
