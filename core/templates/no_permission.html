<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Permission</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded shadow-lg text-center max-w-md w-full">
        <h1 class="text-3xl font-bold text-red-600 mb-4">Access Denied</h1>
        <p class="text-gray-700 mb-6">You do not have permission to view this page. Please log in with an authorized account.</p>
        
        <a href="{% url 'sign_in' %}">
            <button class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-6 rounded transition duration-200">
                Go to Login
            </button>
        </a>
    </div>

</body>
</html>
